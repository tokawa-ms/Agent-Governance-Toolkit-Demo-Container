name: Build and test

on:
  push:
  pull_request:

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgentGovernanceDemo.slnx --nologo

      - name: Build
        run: dotnet build AgentGovernanceDemo.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test AgentGovernanceDemo.slnx --configuration Release --no-build --nologo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Linux amd64 container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/AgentGovernanceDemo/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          no-cache: true
          provenance: false
          sbom: false
          tags: agent-governance-demo:${{ github.sha }}
